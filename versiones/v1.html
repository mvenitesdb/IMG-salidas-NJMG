<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de salidas congregacionales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f5f7; --surface:#ffffff; --ink:#16213a; --muted:#6b7385; --line:#dfe2e8; --accent:#2b4c9b; --accent-ink:#ffffff; --danger:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131a; --surface:#181c26; --ink:#eceff5; --muted:#99a1b3; --line:#2a3040; --accent:#7f9cf0; --accent-ink:#10131a; --danger:#f2b8b5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131a; --surface:#181c26; --ink:#eceff5; --muted:#99a1b3; --line:#2a3040; --accent:#7f9cf0; --accent-ink:#10131a; --danger:#f2b8b5; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 120px;display:grid;gap:24px}
@media(min-width:860px){.wrap{grid-template-columns:minmax(0,1fr) 380px;align-items:start;padding:32px 24px 48px}.preview{position:sticky;top:24px}}
h1{font:600 26px/1.2 Fraunces,Georgia,serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.row.one{grid-template-columns:1fr}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.card{margin-top:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-head strong{font-size:15px}
.tools{display:flex;gap:6px}
.ib{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font-size:16px;cursor:pointer}
.ib.del{color:var(--danger)}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.adds{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.preview .panel{padding:12px}
canvas{display:block;width:100%;height:auto;aspect-ratio:9/16;border-radius:8px;background:#fff}
.actions{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;z-index:5}
.actions .btn{flex:1;max-width:240px}
@media(min-width:860px){.actions{position:static;border:0;background:none;padding:12px 0 0}.actions .btn{max-width:none}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:20}
.overlay.on{display:flex}
.overlay img{max-width:100%;max-height:78vh;border-radius:8px;-webkit-touch-callout:default}
.overlay p{color:#fff;margin:0;text-align:center;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <main>
    <h1>Salidas congregacionales</h1>
    <p class="sub">Complete los datos y la imagen se genera sola. Todo queda guardado en este dispositivo.</p>

    <section class="panel" aria-label="Encabezado">
      <div class="row">
        <div class="field"><label for="title">Título</label><input id="title" type="text" autocomplete="off"></div>
        <div class="field"><label for="subtitle">Grupo o zona</label><input id="subtitle" type="text" autocomplete="off"></div>
      </div>
      <div class="field"><label for="footer">Mensaje al pie (opcional)</label><input id="footer" type="text" autocomplete="off" placeholder="Ej.: ¡Los esperamos!"></div>
      <label>Color</label>
      <div class="themes" id="themes"></div>
    </section>

    <div id="items"></div>

    <div class="adds">
      <button class="btn" id="addSalida" type="button">+ Agregar salida</button>
      <button class="btn" id="addNota" type="button">+ Agregar aviso</button>
      <button class="btn" id="reset" type="button">Empezar de cero</button>
    </div>
  </main>

  <aside class="preview" aria-label="Vista previa">
    <div class="panel"><canvas id="cv" width="1080" height="1920"></canvas></div>
    <div class="actions">
      <button class="btn primary" id="share" type="button">Compartir</button>
      <button class="btn" id="download" type="button">Guardar imagen</button>
    </div>
    <p class="hint">Formato 1080 × 1920 (9:16), listo para WhatsApp.</p>
  </aside>
</div>

<div class="overlay" id="overlay" role="dialog" aria-label="Imagen generada">
  <p>Mantenga presionada la imagen para guardarla o compartirla.</p>
  <img id="ov-img" alt="Imagen de salidas congregacionales">
  <button class="btn primary" id="ov-close" type="button">Cerrar</button>
</div>

<script>
(function(){
  var W=1080,H=1920,M=96;
  var THEMES={
    marino:{name:"Azul marino",bg:"#f6f7fa",ink:"#16213a",accent:"#2b4c9b",muted:"#7a8296",line:"#d6dae3"},
    bordo:{name:"Bordó",bg:"#f8f6f7",ink:"#2a1a20",accent:"#8a2d45",muted:"#85787d",line:"#ded6d9"},
    salvia:{name:"Verde",bg:"#f4f7f5",ink:"#16291f",accent:"#2f7458",muted:"#74827a",line:"#d4dfd8"},
    grafito:{name:"Grafito",bg:"#f5f5f6",ink:"#1d1f24",accent:"#555b69",muted:"#82858d",line:"#dcdde0"},
    noche:{name:"Noche",bg:"#10141d",ink:"#eef0f5",accent:"#8fa8f2",muted:"#8d95a8",line:"#2a3142"}
  };
  var SERIF='Fraunces, Georgia, "Times New Roman", serif';
  var SANS='Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  var KEY="salidas-congregacionales-v1";

  function defaults(){
    return {
      title:"Salidas congregacionales", subtitle:"Norte Gutiérrez", footer:"", theme:"marino",
      items:[
        {k:"salida",day:"Domingo 18",time:"10:30",meet:"Milazzo y C. Belgrano",c1:"Franco Córdoba",c2:"Ramón Braga",terr:"42, 43"},
        {k:"salida",day:"Lunes 19",time:"17:00",meet:"Filial Ojeda",c1:"Adolfo Sapovsky",c2:"Alberto Usún",terr:"52, 55"},
        {k:"nota",day:"Domingo 18",time:"15:00",text:"Limpieza exhaustiva"}
      ]
    };
  }
  var state;
  try{ var raw=localStorage.getItem(KEY); state=raw?JSON.parse(raw):defaults(); }catch(e){ state=defaults(); }
  if(!state||!state.items){ state=defaults(); }

  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
  var $=function(id){return document.getElementById(id)};
  var cv=$("cv"), ctx=cv.getContext("2d");

  /* ---------- Formulario ---------- */
  function bindTop(){
    ["title","subtitle","footer"].forEach(function(f){
      $(f).value=state[f]||"";
      $(f).addEventListener("input",function(){ state[f]=$(f).value; changed(); });
    });
    var box=$("themes"); box.innerHTML="";
    Object.keys(THEMES).forEach(function(k){
      var b=document.createElement("button"); b.type="button"; b.className="sw";
      var t=THEMES[k]; b.style.background="linear-gradient(135deg,"+t.bg+" 50%,"+t.accent+" 50%)";
      b.title=t.name; b.setAttribute("aria-label",t.name); b.setAttribute("aria-pressed",String(state.theme===k));
      b.addEventListener("click",function(){ state.theme=k; bindTop(); changed(); });
      box.appendChild(b);
    });
  }

  function fieldHTML(i,key,label,val,ph){
    return '<div class="field"><label for="f'+i+key+'">'+label+'</label><input id="f'+i+key+'" data-i="'+i+'" data-k="'+key+'" type="text" autocomplete="off" value="'+esc(val||"")+'" placeholder="'+(ph||"")+'"></div>';
  }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}

  function renderItems(){
    var box=$("items"); var html="";
    state.items.forEach(function(it,i){
      var isS=it.k==="salida";
      html+='<section class="panel card" aria-label="'+(isS?"Salida":"Aviso")+' '+(i+1)+'">'
        +'<div class="card-head"><strong>'+(isS?"Salida":"Aviso")+' '+(i+1)+'</strong><div class="tools">'
        +'<button class="ib" type="button" data-act="up" data-i="'+i+'" aria-label="Subir">↑</button>'
        +'<button class="ib" type="button" data-act="down" data-i="'+i+'" aria-label="Bajar">↓</button>'
        +'<button class="ib" type="button" data-act="dup" data-i="'+i+'" aria-label="Duplicar">⧉</button>'
        +'<button class="ib del" type="button" data-act="del" data-i="'+i+'" aria-label="Eliminar">✕</button>'
        +'</div></div>'
        +'<div class="row">'+fieldHTML(i,"day","Día y fecha",it.day,"Domingo 18")+fieldHTML(i,"time","Horario",it.time,"10:30")+'</div>';
      if(isS){
        html+=fieldHTML(i,"meet","Punto de encuentro",it.meet,"")
          +'<div class="row">'+fieldHTML(i,"c1","1.º conductor",it.c1,"")+fieldHTML(i,"c2","2.º conductor",it.c2,"")+'</div>'
          +fieldHTML(i,"terr","Territorios",it.terr,"42, 43");
      } else {
        html+=fieldHTML(i,"text","Texto del aviso",it.text,"Limpieza exhaustiva");
      }
      html+='</section>';
    });
    box.innerHTML=html;
  }

  $("items").addEventListener("input",function(e){
    var t=e.target; if(!t.dataset||t.dataset.k===undefined) return;
    state.items[+t.dataset.i][t.dataset.k]=t.value; changed();
  });
  $("items").addEventListener("click",function(e){
    var b=e.target.closest("button[data-act]"); if(!b) return;
    var i=+b.dataset.i, a=b.dataset.act, it=state.items;
    if(a==="del"){ it.splice(i,1); }
    else if(a==="dup"){ it.splice(i+1,0,JSON.parse(JSON.stringify(it[i]))); }
    else if(a==="up"&&i>0){ var t=it[i]; it[i]=it[i-1]; it[i-1]=t; }
    else if(a==="down"&&i<it.length-1){ var t2=it[i]; it[i]=it[i+1]; it[i+1]=t2; }
    renderItems(); changed();
  });
  $("addSalida").addEventListener("click",function(){
    state.items.push({k:"salida",day:"",time:"",meet:"",c1:"",c2:"",terr:""}); renderItems(); changed();
  });
  $("addNota").addEventListener("click",function(){
    state.items.push({k:"nota",day:"",time:"",text:""}); renderItems(); changed();
  });
  $("reset").addEventListener("click",function(){
    if(!window.confirm("¿Borrar todos los datos y empezar de cero?")) return;
    state={title:"Salidas congregacionales",subtitle:"",footer:"",theme:state.theme,items:[{k:"salida",day:"",time:"",meet:"",c1:"",c2:"",terr:""}]};
    bindTop(); renderItems(); changed();
  });

  /* ---------- Dibujo ---------- */
  function wrap(text,maxW){
    var out=[]; String(text||"").split("\n").forEach(function(par){
      var words=par.split(/\s+/).filter(Boolean), line="";
      if(!words.length){ return; }
      words.forEach(function(w){
        var test=line?line+" "+w:w;
        if(ctx.measureText(test).width>maxW&&line){ out.push(line); line=w; } else { line=test; }
      });
      if(line) out.push(line);
    });
    return out;
  }
  function fmtTime(t){
    t=(t||"").trim(); if(!t) return "";
    if(/^\d{1,2}([:.]\d{2})?$/.test(t)) return t.replace(".",":")+" hs";
    return t;
  }
  function setFont(w,size,fam,style){ ctx.font=(style||"")+" "+w+" "+size+"px "+fam; }
  function spaced(on,px){ if("letterSpacing" in ctx) ctx.letterSpacing=on?px+"px":"0px"; }

  function render(s,dry,y0,th){
    var y=y0, x0=M, xr=W-M, labelW=300*s, xv=x0+labelW+30, maxV=xr-xv;
    ctx.textBaseline="alphabetic";
    state.items.forEach(function(it,idx){
      if(idx>0) y+=84*s;
      // Encabezado del bloque: día + hora
      var day=(it.day||"").trim(), time=fmtTime(it.time);
      var hs=60*s;
      if(day||time){
        y+=hs;
        if(!dry){
          ctx.textAlign="left"; ctx.fillStyle=th.ink; setFont(500,hs,SERIF); ctx.fillText(day,x0,y);
          ctx.textAlign="right"; ctx.fillStyle=th.accent; setFont(600,38*s,SANS); ctx.fillText(time,xr,y);
        }
        y+=26*s;
        if(!dry){ ctx.fillStyle=th.line; ctx.fillRect(x0,y,xr-x0,2); }
        y+=22*s;
      }
      if(it.k==="salida"){
        var rows=[["Encuentro",it.meet],["1.º conductor",it.c1],["2.º conductor",it.c2],["Territorios",it.terr]];
        rows.forEach(function(r){
          if(!(r[1]||"").trim()) return;
          setFont(500,42*s,SANS); var lines=wrap(r[1],maxV);
          var lh=54*s;
          y+=34*s+ (0);
          var base=y+22*s;
          if(!dry){
            ctx.textAlign="left"; ctx.fillStyle=th.muted; setFont(400,27*s,SANS); ctx.fillText(r[0],x0,base);
            ctx.fillStyle=th.ink; setFont(500,42*s,SANS);
            lines.forEach(function(l,li){ ctx.fillText(l,xv,base+li*lh); });
          }
          y=base+(lines.length-1)*lh+14*s;
        });
      } else {
        setFont(400,42*s,SERIF,"italic"); var ls=wrap(it.text,xr-x0);
        ls.forEach(function(l){
          y+=58*s;
          if(!dry){ ctx.textAlign="left"; ctx.fillStyle=th.ink; setFont(400,42*s,SERIF,"italic"); ctx.fillText(l,x0,y); }
        });
        y+=6*s;
      }
    });
    return y-y0;
  }

  function draw(){
    var th=THEMES[state.theme]||THEMES.marino;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=th.bg; ctx.fillRect(0,0,W,H);
    ctx.textBaseline="alphabetic"; spaced(false,0);

    // Encabezado
    var y=150;
    ctx.fillStyle=th.accent; ctx.fillRect(M,y-34,72,6);
    var sub=(state.subtitle||"").trim();
    if(sub){
      y+=34; ctx.textAlign="left"; ctx.fillStyle=th.accent; setFont(600,36,SANS); spaced(true,1); ctx.fillText(sub,M,y); spaced(false,0);
      y+=20;
    }
    var title=(state.title||"").trim();
    var tsize=104, tl=[];
    if(title){
      setFont(600,tsize,SERIF); tl=wrap(title,W-2*M);
      while(tl.length>3&&tsize>64){ tsize-=6; setFont(600,tsize,SERIF); tl=wrap(title,W-2*M); }
      ctx.fillStyle=th.ink;
      tl.forEach(function(l){ y+=tsize*1.08; ctx.fillText(l,M,y); });
    }
    y+=56;
    var topY=y;
    var footerY=H-150;
    var availBottom=(state.footer||"").trim()?footerY-70:H-130;
    var avail=availBottom-topY;

    // Ajuste de escala para que todo entre
    var s=1, h=render(1,true,0,th);
    while(h>avail&&s>0.45){ s-=0.02; h=render(s,true,0,th); }
    var start=topY+Math.max(0,Math.min((avail-h)/2,140));
    render(s,false,start,th);

    // Pie
    var f=(state.footer||"").trim();
    if(f){
      ctx.textAlign="center"; ctx.fillStyle=th.muted; setFont(400,32,SERIF,"italic");
      var fl=wrap(f,W-2*M); fl.forEach(function(l,i){ ctx.fillText(l,W/2,footerY+i*44); });
    }
    ctx.fillStyle=th.accent; ctx.fillRect(M,H-96,W-2*M,2);
    ctx.textAlign="left";
  }

  var pending=false;
  function schedule(){ if(pending) return; pending=true; requestAnimationFrame(function(){ pending=false; draw(); }); }
  function changed(){ save(); schedule(); }

  /* ---------- Exportar ---------- */
  function toBlob(){ return new Promise(function(res){ cv.toBlob(res,"image/png"); }); }
  function fname(){
    var d=new Date(); return "salidas-"+d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)+".png";
  }
  function showOverlay(blob){
    $("ov-img").src=URL.createObjectURL(blob); $("overlay").classList.add("on");
  }
  $("ov-close").addEventListener("click",function(){ $("overlay").classList.remove("on"); });

  $("download").addEventListener("click",async function(){
    draw(); var blob=await toBlob(); if(!blob) return;
    try{
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname();
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){}
    showOverlay(blob);
  });
  $("share").addEventListener("click",async function(){
    draw(); var blob=await toBlob(); if(!blob) return;
    var file=new File([blob],fname(),{type:"image/png"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:state.title||"Salidas congregacionales"});
        return;
      }
    }catch(e){ if(e&&e.name==="AbortError") return; }
    showOverlay(blob);
  });

  /* ---------- Inicio ---------- */
  bindTop(); renderItems(); draw();
  if(document.fonts&&document.fonts.load){
    Promise.all([
      document.fonts.load('600 60px Fraunces'),document.fonts.load('500 60px Fraunces'),
      document.fonts.load('italic 400 40px Fraunces'),
      document.fonts.load('400 30px Inter'),document.fonts.load('500 40px Inter'),document.fonts.load('600 36px Inter')
    ]).then(draw).catch(function(){});
    document.fonts.ready.then(draw);
  }
})();
</script>
</body>
</html>
